<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Fragment Player</title>
<link rel="manifest" href="manifest.json">
<style>
/* ===== СБРОС И БАЗА ===== */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:#0b0e14;color:#e5e9f0;
  min-height:100vh;min-height:100dvh;
  display:flex;align-items:flex-start;justify-content:center;
  padding:16px;padding-top:calc(16px + env(safe-area-inset-top));
  padding-bottom:calc(16px + env(safe-area-inset-bottom));
  overscroll-behavior:none;
}
.app{
  max-width:680px;width:100%;
  background:#141a24;border-radius:32px;
  padding:24px 20px 28px;
  box-shadow:0 20px 40px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.03);
}
h1{font-size:1.5rem;font-weight:500;color:#c0caf5;margin-bottom:4px;display:flex;align-items:center;gap:8px}
h1 span{font-size:.8rem;background:#1f2a36;padding:4px 10px;border-radius:40px;color:#7aa2f7;font-weight:400}
.subtitle{font-size:.75rem;color:#4f617a;margin-bottom:16px}

/* ===== ВЫБОР ФАЙЛОВ ===== */
.file-input-label{
  display:block;background:#1e2533;border:1.5px dashed #3b4b5e;
  border-radius:20px;padding:16px;text-align:center;
  font-size:.95rem;color:#9aa9c0;cursor:pointer;transition:.2s;
  margin-bottom:14px;
}
.file-input-label:active{background:#253040;border-color:#5f7a9e}
.file-input-label input{display:none}

/* ===== ПЛЕЙЛИСТ ===== */
.playlist{
  background:#0d121a;border-radius:16px;padding:8px;
  max-height:120px;overflow-y:auto;font-size:.85rem;
  margin-bottom:14px;border:1px solid #1d2a3a;
}
.playlist-item{
  padding:8px 12px;border-radius:10px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  color:#a9b8d0;transition:.15s;cursor:pointer;
  display:flex;justify-content:space-between;gap:8px;align-items:center;
}
.playlist-item.active{background:#1e2b3e;color:#e0e7ff;font-weight:500;box-shadow:inset 0 0 0 1px #2f4460}
.playlist-item:hover{background:#1a2638}
.playlist-item .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.badge{font-size:.65rem;background:#1b2533;padding:2px 8px;border-radius:20px;color:#7aa2f7;flex-shrink:0}
.badge.ready{color:#9ece6a}
.badge.analyzing{color:#e0af68}

/* ===== СТАТУС ===== */
.status-panel{
  background:#0f151f;border-radius:20px;padding:14px 16px;
  margin-bottom:16px;display:grid;grid-template-columns:1fr auto;
  align-items:center;gap:10px;border:1px solid #1f2f40;
}
.status-filename{font-size:.9rem;font-weight:500;color:#d0dbf5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.status-detail{font-size:.8rem;color:#8e9fb1;display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.status-detail span{background:#1b2533;padding:2px 8px;border-radius:20px}
.db-meter{
  background:#0a0f16;border-radius:40px;padding:6px 14px;
  font-family:monospace;font-size:1rem;font-weight:600;
  color:#9ece6a;border:1px solid #2a3a4e;min-width:90px;text-align:center;
}
.db-meter.low{color:#f7768e}

/* ===== КНОПКИ ===== */
.controls-grid{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;margin:16px 0 12px}
.ctrl-btn{
  background:#1d2a3c;border:none;border-radius:80px;
  width:58px;height:58px;display:flex;align-items:center;justify-content:center;
  color:#e0e9ff;font-size:1.6rem;cursor:pointer;transition:.15s;
  box-shadow:0 5px 0 #0b1017,0 7px 14px rgba(0,0,0,.6);user-select:none;
}
.ctrl-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #0b1017,0 7px 14px rgba(0,0,0,.5)}
.ctrl-btn.small{width:48px;height:48px;font-size:1.3rem}
.ctrl-btn.primary{
  background:#2d4c7c;width:70px;height:70px;font-size:2rem;
  box-shadow:0 5px 0 #14233a,0 7px 14px rgba(0,0,0,.6);
}

/* ===== НАСТРОЙКИ ===== */
.settings{
  display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;
  background:#0f151f;border-radius:24px;padding:16px;
  margin-top:16px;border:1px solid #1d2a3a;
}
.setting-item{display:flex;flex-direction:column;gap:5px}
.setting-item label{
  font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;
  color:#7e8ea8;font-weight:500;display:flex;justify-content:space-between;
}
.setting-item label span{color:#a9c1e6;font-weight:600;text-transform:none;font-size:.8rem}
input[type=range]{width:100%;-webkit-appearance:none;background:transparent;margin:2px 0}
input[type=range]::-webkit-slider-runnable-track{height:5px;background:#202c3c;border-radius:10px}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:18px;height:18px;border-radius:20px;
  background:#7aa2f7;margin-top:-7px;box-shadow:0 2px 6px rgba(0,0,0,.6);
  cursor:pointer;border:1.5px solid #b4c8ff;
}
input[type=number]{
  background:#1a2332;border:1px solid #2d4058;border-radius:12px;
  padding:6px 10px;color:#e0e9ff;font-size:.9rem;width:100%;outline:none;font-weight:500;
}
input[type=number]:focus{border-color:#7aa2f7}

/* ===== ПРЕСЕТЫ ===== */
.presets{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.preset-btn{
  background:#1a2332;border:1px solid #2d4058;border-radius:20px;
  padding:6px 14px;color:#a9c1e6;font-size:.75rem;cursor:pointer;transition:.15s;
}
.preset-btn:active{background:#253040;border-color:#5f7a9e}
.preset-btn.active{background:#2d4c7c;border-color:#7aa2f7;color:#fff}

.footnote{font-size:.65rem;color:#4f617a;text-align:center;margin-top:14px}
audio{display:none}
</style>
</head>
<body>
<div class="app">
  <h1>🔊 Fragment<span>player</span></h1>
  <div class="subtitle">офлайн · фоновое воспроизведение · PWA</div>

  <label class="file-input-label">
    📂 Выбрать аудиофайлы
    <input type="file" id="fileInput" accept="audio/*" multiple>
  </label>

  <div class="playlist" id="playlist">
    <div style="color:#4f617a;padding:8px;font-style:italic;font-size:.85rem;">Файлы не загружены</div>
  </div>

  <div class="status-panel">
    <div>
      <div class="status-filename" id="currentFileName">—</div>
      <div class="status-detail">
        <span id="fragmentIndexDisplay">Фрагмент 0/0</span>
        <span id="repeatDisplay">Повтор 0/0</span>
      </div>
    </div>
    <div class="db-meter" id="dbMeter">— дБ</div>
  </div>

  <div class="controls-grid">
    <button class="ctrl-btn small" id="prevBtn">⏮</button>
    <button class="ctrl-btn primary" id="playPauseBtn">▶</button>
    <button class="ctrl-btn small" id="nextBtn">⏭</button>
  </div>

  <div class="settings">
    <div class="setting-item">
      <label>Порог тишины <span id="silenceThresholdVal">-40 дБ</span></label>
      <input type="range" id="silenceThreshold" min="-60" max="-20" value="-40" step="1">
    </div>
    <div class="setting-item">
      <label>Длительность тишины <span id="silenceDurationVal">0.6 с</span></label>
      <input type="range" id="silenceDuration" min="0.1" max="3.0" value="0.6" step="0.1">
    </div>
    <div class="setting-item">
      <label>Повторы (N) <span id="repeatsVal">3</span></label>
      <input type="number" id="repeats" min="1" max="20" value="3" step="1">
    </div>
    <div class="setting-item">
      <label>Задержка <span id="delayVal">0.2 с</span></label>
      <input type="range" id="interDelay" min="0" max="10" value="0.2" step="0.1">
    </div>
    <div class="setting-item" style="grid-column:span 2">
      <label>Скорость <span id="speedVal">1.0x</span></label>
      <input type="range" id="playbackSpeed" min="0.5" max="2.0" value="1.0" step="0.05">
    </div>
  </div>

  <div class="presets">
    <button class="preset-btn" data-preset="language">🗣 Язык</button>
    <button class="preset-btn" data-preset="music">🎵 Музыка</button>
    <button class="preset-btn" data-preset="podcast">🎙 Подкаст</button>
    <button class="preset-btn" data-preset="audiobook">📖 Аудиокнига</button>
  </div>

  <div class="footnote">PWA · установите на Android через меню браузера</div>
  <audio id="audioEl" preload="auto"></audio>
</div>

<script>
(function(){
  'use strict';

  // ===== DOM =====
  const fileInput = document.getElementById('fileInput');
  const playlistEl = document.getElementById('playlist');
  const currentFileNameEl = document.getElementById('currentFileName');
  const fragmentIndexDisplay = document.getElementById('fragmentIndexDisplay');
  const repeatDisplay = document.getElementById('repeatDisplay');
  const dbMeterEl = document.getElementById('dbMeter');
  const playPauseBtn = document.getElementById('playPauseBtn');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const silenceThresholdInput = document.getElementById('silenceThreshold');
  const silenceThresholdVal = document.getElementById('silenceThresholdVal');
  const silenceDurationInput = document.getElementById('silenceDuration');
  const silenceDurationVal = document.getElementById('silenceDurationVal');
  const repeatsInput = document.getElementById('repeats');
  const repeatsVal = document.getElementById('repeatsVal');
  const interDelayInput = document.getElementById('interDelay');
  const delayVal = document.getElementById('delayVal');
  const playbackSpeedInput = document.getElementById('playbackSpeed');
  const speedVal = document.getElementById('speedVal');
  const audioEl = document.getElementById('audioEl');

  // ===== СОСТОЯНИЕ =====
  let playlist = [];
  let currentIndex = -1;
  let fragments = [];
  let fragIdx = 0;
  let repeatIdx = 0;
  let analysisDone = false;
  let isPlaying = false;
  let delayTimer = null;
  let boundaryTimer = null;
  let seekPending = false;
  let pendingPlayAfterSeek = false;
  let lastDb = -100;

  // Настройки
  let silenceThresholdDb = -40;
  let silenceDurationSec = 0.6;
  let repeatsN = 3;
  let interDelaySec = 0.2;
  let playbackRate = 1.0;

  // AudioContext для анализа (только decodeAudioData, без createMediaElementSource!)
  let decodeCtx = null;
  function getDecodeCtx(){
    if (!decodeCtx) decodeCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (decodeCtx.state === 'suspended') decodeCtx.resume().catch(()=>{});
    return decodeCtx;
  }

  // ===== MEDIA SESSION API =====
  // Интеграция с Android: уведомления, локскрин, кнопки наушников
  function updateMediaSession(){
    if (!('mediaSession' in navigator)) return;
    const item = playlist[currentIndex];
    if (!item){ navigator.mediaSession.metadata = null; return; }
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: item.name,
        artist: `Фрагмент ${fragIdx+1}/${fragments.length} · Повтор ${repeatIdx+1}/${repeatsN}`,
        album: 'Fragment Player'
      });
      // Обработчики для кнопок на локскрине/наушниках
      const handlers = [
        ['play', () => { audioEl.play().catch(()=>{}); }],
        ['pause', () => { audioEl.pause(); }],
        ['previoustrack', () => prevFragment()],
        ['nexttrack', () => nextFragment()],
        ['seekbackward', () => { audioEl.currentTime = Math.max(0, audioEl.currentTime - 5); }],
        ['seekforward', () => { audioEl.currentTime = Math.min(audioEl.duration||0, audioEl.currentTime + 5); }]
      ];
      handlers.forEach(([action, handler]) => {
        try { navigator.mediaSession.setActionHandler(action, handler); } catch(e){}
      });
    } catch(e){}
  }

  // ===== МГНОВЕННЫЙ СТАРТ =====
  fileInput.addEventListener('change', (e) => {
    const files = Array.from(e.target.files);
    if (!files.length) return;
    playlist.forEach(it => { if (it.url) URL.revokeObjectURL(it.url); });
    playlist = files.map(file => ({
      name: file.name,
      url: URL.createObjectURL(file),
      file: file,
      fragments: [],
      totalDuration: 0,
      analyzing: false,
      doneAnalyzing: false,
      buffer: null
    }));
    currentIndex = -1;
    switchToIndex(0, true);
    // Параллельный анализ — каждый в своём микротаске, не блокирует play()
    playlist.forEach((item, i) => {
      setTimeout(() => analyzeFileInBackground(item), i * 10);
    });
    renderPlaylist();
  });

  // ===== ФОНОВЫЙ АНАЛИЗ =====
  async function analyzeFileInBackground(item){
    item.analyzing = true;
    renderPlaylist();
    let buffer;
    try {
      const arrayBuffer = await item.file.arrayBuffer();
      const ctx = getDecodeCtx();
      buffer = await ctx.decodeAudioData(arrayBuffer);
    } catch(err){
      console.warn('Ошибка декодирования', item.name, err);
      item.analyzing = false;
      item.doneAnalyzing = true;
      renderPlaylist();
      return;
    }
    item.buffer = buffer;
    item.totalDuration = buffer.duration;

    const sr = buffer.sampleRate;
    const ch0 = buffer.getChannelData(0);
    const ch1 = buffer.numberOfChannels > 1 ? buffer.getChannelData(1) : null;
    const len = ch0.length;
    const winSize = Math.max(1, Math.floor(sr * 0.02)); // 20 мс
    const numWin = Math.floor(len / winSize);
    const silThr = Math.pow(10, silenceThresholdDb / 20);
    const loudThr = Math.pow(10, (silenceThresholdDb + 10) / 20); // гистерезис +10 дБ
    const minSilenceWin = Math.max(1, Math.ceil(silenceDurationSec / 0.02));
    const minFragWin = Math.ceil(0.4 / 0.02);

    let inSpeech = false, speechStart = 0, silenceCount = 0, silenceStartWin = -1, w = 0;
    const CHUNK = 400;
    const isCurrent = () => playlist[currentIndex] === item;

    while (w < numWin){
      const end = Math.min(w + CHUNK, numWin);
      for (; w < end; w++){
        let sum = 0;
        const start = w * winSize;
        for (let i = 0; i < winSize; i++){
          const s0 = ch0[start + i];
          const s1 = ch1 ? ch1[start + i] : 0;
          const s = ch1 ? (s0 + s1) * 0.5 : s0;
          sum += s * s;
        }
        const rms = Math.sqrt(sum / winSize);
        // Гистерезис: точно звук / точно тишина / неопределённость (сохраняем состояние)
        let isSpeech;
        if (rms > loudThr) isSpeech = true;
        else if (rms < silThr) isSpeech = false;
        else isSpeech = inSpeech;

        if (isSpeech){
          if (!inSpeech){ inSpeech = true; speechStart = w; }
          silenceCount = 0; silenceStartWin = -1;
        } else if (inSpeech){
          if (silenceStartWin < 0) silenceStartWin = w;
          silenceCount++;
          if (silenceCount >= minSilenceWin){
            const endWin = silenceStartWin;
            const startTime = speechStart * 0.02;
            const endTime = endWin * 0.02;
            if ((endWin - speechStart) >= minFragWin){
              const frag = { start: startTime, end: endTime };
              const prev = item.fragments[item.fragments.length - 1];
              if (prev && (frag.start - prev.end) < 0.15){
                prev.end = frag.end; // склейка близких
              } else {
                item.fragments.push(frag);
                if (isCurrent()) onNewFragmentAvailable();
              }
            }
            inSpeech = false; silenceCount = 0; silenceStartWin = -1;
          }
        }
      }
      await new Promise(r => setTimeout(r, 0));
    }
    if (inSpeech){
      const endWin = (silenceStartWin >= 0 ? silenceStartWin : numWin);
      const startTime = speechStart * 0.02;
      const endTime = Math.min(buffer.duration, endWin * 0.02);
      if ((endWin - speechStart) >= minFragWin){
        const frag = { start: startTime, end: endTime };
        const prev = item.fragments[item.fragments.length - 1];
        if (prev && (frag.start - prev.end) < 0.15){ prev.end = frag.end; }
        else { item.fragments.push(frag); if (isCurrent()) onNewFragmentAvailable(); }
      }
    }
    item.analyzing = false;
    item.doneAnalyzing = true;
    renderPlaylist();
    if (isCurrent()){
      analysisDone = true;
      if (isPlaying && !boundaryTimer && !delayTimer){
        const t = audioEl.currentTime;
        const idx = findFragmentAt(t);
        if (idx >= 0){ fragIdx = idx; repeatIdx = 0; }
        scheduleFragmentEnd();
      }
      updateStatusDisplay();
      updateMediaSession();
    }
  }

  function findFragmentAt(t){
    for (let i = 0; i < fragments.length; i++)
      if (t >= fragments[i].start && t < fragments[i].end) return i;
    return -1;
  }

  function onNewFragmentAvailable(){
    if (analysisDone){ updateStatusDisplay(); return; }
    if (fragments.length === 0){
      fragments = playlist[currentIndex].fragments;
      fragIdx = 0; repeatIdx = 0;
      if (isPlaying && audioEl.currentTime < 0.5 && fragments[0].start < 0.5){
        scheduleFragmentEnd();
      } else if (isPlaying){
        safeSeek(fragments[0].start, true);
      }
    } else {
      fragments = playlist[currentIndex].fragments;
    }
    updateStatusDisplay();
    updateMediaSession();
  }

  // ===== SEEK-SAFE =====
  function safeSeek(time, thenPlay){
    seekPending = true;
    pendingPlayAfterSeek = !!thenPlay;
    try { audioEl.currentTime = time; } catch(e){}
    const t = setTimeout(() => {
      if (seekPending){
        seekPending = false;
        if (pendingPlayAfterSeek){ pendingPlayAfterSeek = false; audioEl.play().catch(()=>{}); }
        scheduleFragmentEnd();
      }
    }, 300);
    audioEl.addEventListener('seeked', function onSeeked(){
      audioEl.removeEventListener('seeked', onSeeked);
      clearTimeout(t);
      if (!seekPending) return;
      seekPending = false;
      if (pendingPlayAfterSeek){ pendingPlayAfterSeek = false; audioEl.play().catch(()=>{}); }
      scheduleFragmentEnd();
    }, { once: true });
  }

  // ===== ТАЙМЕР ФРАГМЕНТА =====
  function scheduleFragmentEnd(){
    if (boundaryTimer){ clearTimeout(boundaryTimer); boundaryTimer = null; }
    if (!fragments.length || !isPlaying) return;
    const cur = fragments[fragIdx];
    if (!cur) return;
    const remain = (cur.end - audioEl.currentTime) / playbackRate;
    if (remain <= 0.02){ onFragmentEnd(); return; }
    boundaryTimer = setTimeout(onFragmentEnd, remain * 1000 + 25);
  }

  function onFragmentEnd(){
    if (boundaryTimer){ clearTimeout(boundaryTimer); boundaryTimer = null; }
    audioEl.pause();
    if (!fragments.length) return;

    if (repeatIdx + 1 < repeatsN){
      repeatIdx++;
      updateStatusDisplay(); updateMediaSession();
      const startFrag = fragments[fragIdx].start;
      const doPlay = () => safeSeek(startFrag, true);
      if (interDelaySec > 0){
        delayTimer = setTimeout(() => { delayTimer = null; doPlay(); }, interDelaySec * 1000);
      } else doPlay();
      return;
    }
    if (fragIdx + 1 < fragments.length){
      fragIdx++; repeatIdx = 0;
      updateStatusDisplay(); updateMediaSession();
      const next = fragments[fragIdx];
      const doPlay = () => safeSeek(next.start, true);
      if (interDelaySec > 0){
        delayTimer = setTimeout(() => { delayTimer = null; doPlay(); }, interDelaySec * 1000);
      } else doPlay();
      return;
    }
    if (!analysisDone){ updateStatusDisplay(); return; } // ждём анализа
    if (currentIndex + 1 < playlist.length){ switchToIndex(currentIndex + 1, true); }
    else { isPlaying = false; updateStatusDisplay(); updateMediaSession(); }
  }

  function playPause(){
    if (isPlaying) pause(); else resume();
  }
  function pause(){
    if (delayTimer){ clearTimeout(delayTimer); delayTimer = null; }
    if (boundaryTimer){ clearTimeout(boundaryTimer); boundaryTimer = null; }
    audioEl.pause();
    isPlaying = false;
    updateStatusDisplay(); updateMediaSession();
  }
  function resume(){
    if (!fragments.length){ audioEl.play().catch(()=>{}); isPlaying = true; updateStatusDisplay(); return; }
    const cur = fragments[fragIdx];
    if (!cur) return;
    const t = audioEl.currentTime;
    if (t < cur.start || t >= cur.end) safeSeek(cur.start, true);
    else { audioEl.play().catch(()=>{}); scheduleFragmentEnd(); }
    isPlaying = true;
    updateStatusDisplay(); updateMediaSession();
  }

  // ===== ПЕРЕКЛЮЧЕНИЕ ФАЙЛА =====
  function switchToIndex(idx, autoPlay){
    if (idx < 0 || idx >= playlist.length) return;
    if (delayTimer){ clearTimeout(delayTimer); delayTimer = null; }
    if (boundaryTimer){ clearTimeout(boundaryTimer); boundaryTimer = null; }
    audioEl.pause();
    currentIndex = idx;
    const item = playlist[idx];
    audioEl.src = item.url;
    audioEl.playbackRate = playbackRate;
    audioEl.load();
    fragments = item.fragments;
    fragIdx = 0; repeatIdx = 0; analysisDone = item.doneAnalyzing;
    renderPlaylist(); updateStatusDisplay(); updateMediaSession();

    if (autoPlay){
      isPlaying = true;
      const start = () => {
        audioEl.removeEventListener('loadedmetadata', start);
        audioEl.currentTime = 0;
        audioEl.play().catch(()=>{});
        if (fragments.length) scheduleFragmentEnd();
        updateStatusDisplay(); updateMediaSession();
      };
      if (audioEl.readyState >= 1) start();
      else audioEl.addEventListener('loadedmetadata', start, { once: true });
    }
  }

  // ===== НАВИГАЦИЯ =====
  function prevFragment(){
    if (delayTimer){ clearTimeout(delayTimer); delayTimer = null; }
    if (!fragments.length){ safeSeek(0, isPlaying); return; }
    if (fragIdx > 0) fragIdx--;
    repeatIdx = 0;
    updateStatusDisplay(); updateMediaSession();
    safeSeek(fragments[fragIdx].start, isPlaying);
  }
  function nextFragment(){
    if (delayTimer){ clearTimeout(delayTimer); delayTimer = null; }
    if (!fragments.length) return;
    if (fragIdx + 1 < fragments.length){
      fragIdx++; repeatIdx = 0;
      updateStatusDisplay(); updateMediaSession();
      safeSeek(fragments[fragIdx].start, isPlaying);
    } else if (currentIndex + 1 < playlist.length){
      switchToIndex(currentIndex + 1, true);
    }
  }

  // ===== UI =====
  function updateStatusDisplay(){
    const item = playlist[currentIndex];
    currentFileNameEl.textContent = item ? item.name : '—';
    const total = fragments.length;
    const cur = total > 0 ? fragIdx + 1 : 0;
    fragmentIndexDisplay.textContent = `Фрагмент ${cur}/${total}${analysisDone ? '' : '…'}`;
    repeatDisplay.textContent = (total > 0 && isPlaying) ? `Повтор ${repeatIdx + 1}/${repeatsN}` : `Повтор 0/${repeatsN}`;
    playPauseBtn.textContent = isPlaying ? '⏸' : '▶';
  }

  function renderPlaylist(){
    if (!playlist.length){
      playlistEl.innerHTML = '<div style="color:#4f617a;padding:8px;font-style:italic;font-size:.85rem;">Файлы не загружены</div>';
      return;
    }
    playlistEl.innerHTML = '';
    playlist.forEach((item, idx) => {
      const div = document.createElement('div');
      div.className = 'playlist-item' + (idx === currentIndex ? ' active' : '');
      const name = document.createElement('span'); name.className = 'name'; name.textContent = item.name;
      const badge = document.createElement('span');
      if (item.analyzing){ badge.className = 'badge analyzing'; badge.textContent = `анализ… ${item.fragments.length}`; }
      else if (item.doneAnalyzing){ badge.className = 'badge ready'; badge.textContent = `${item.fragments.length} фрагм.`; }
      else { badge.className = 'badge'; badge.textContent = '—'; }
      div.appendChild(name); div.appendChild(badge);
      div.addEventListener('click', () => switchToIndex(idx, true));
      playlistEl.appendChild(div);
    });
  }

  // ===== dB-ИНДИКАТОР (без Web Audio API на элементе!) =====
  // Используем отдельный AudioContext только для анализа, НЕ подключаем к audioEl
  // Это безопасно для file:// и не блокирует фоновое воспроизведение
  let meterCtx = null, meterAnalyser = null, meterSource = null;
  function startMeter(){
    // Просто показываем статус воспроизведения — без реального анализа потока
    // Это avoids createMediaElementSource, который ломает background playback
    const loop = () => {
      if (isPlaying){
        dbMeterEl.textContent = '▶';
        dbMeterEl.classList.remove('low');
      } else {
        dbMeterEl.textContent = '— дБ';
      }
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
  startMeter();

  // ===== НАСТРОЙКИ =====
  silenceThresholdInput.addEventListener('input', e => {
    silenceThresholdDb = parseFloat(e.target.value);
    silenceThresholdVal.textContent = silenceThresholdDb + ' дБ';
    reanalyzeCurrent();
  });
  silenceDurationInput.addEventListener('input', e => {
    silenceDurationSec = parseFloat(e.target.value);
    silenceDurationVal.textContent = silenceDurationSec.toFixed(1) + ' с';
    reanalyzeCurrent();
  });
  repeatsInput.addEventListener('change', e => {
    let v = parseInt(e.target.value, 10);
    if (isNaN(v) || v < 1) v = 1; if (v > 20) v = 20;
    repeatsN = v; repeatsInput.value = v; repeatsVal.textContent = v;
    updateStatusDisplay(); updateMediaSession();
  });
  interDelayInput.addEventListener('input', e => {
    interDelaySec = parseFloat(e.target.value);
    delayVal.textContent = interDelaySec.toFixed(1) + ' с';
  });
  playbackSpeedInput.addEventListener('input', e => {
    playbackRate = parseFloat(e.target.value);
    speedVal.textContent = playbackRate.toFixed(2) + 'x';
    audioEl.playbackRate = playbackRate;
    if (isPlaying) scheduleFragmentEnd();
  });

  function reanalyzeCurrent(){
    const item = playlist[currentIndex];
    if (!item || !item.file) return;
    item.fragments = []; item.doneAnalyzing = false; item.analyzing = false;
    if (playlist[currentIndex] === item){
      fragments = item.fragments; fragIdx = 0; repeatIdx = 0; analysisDone = false;
      updateStatusDisplay();
    }
    analyzeFileInBackground(item);
  }

  // ===== ПРЕСЕТЫ =====
  const presets = {
    language: { threshold: -45, duration: 0.5, repeats: 3, delay: 0.5, speed: 0.9 },
    music:    { threshold: -35, duration: 1.0, repeats: 1, delay: 0.0, speed: 1.0 },
    podcast:  { threshold: -40, duration: 0.8, repeats: 2, delay: 0.3, speed: 1.0 },
    audiobook:{ threshold: -45, duration: 0.6, repeats: 3, delay: 0.4, speed: 0.95 }
  };
  document.querySelectorAll('.preset-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const p = presets[btn.dataset.preset];
      silenceThresholdInput.value = p.threshold; silenceThresholdDb = p.threshold;
      silenceThresholdVal.textContent = p.threshold + ' дБ';
      silenceDurationInput.value = p.duration; silenceDurationSec = p.duration;
      silenceDurationVal.textContent = p.duration.toFixed(1) + ' с';
      repeatsInput.value = p.repeats; repeatsN = p.repeats; repeatsVal.textContent = p.repeats;
      interDelayInput.value = p.delay; interDelaySec = p.delay; delayVal.textContent = p.delay.toFixed(1) + ' с';
      playbackSpeedInput.value = p.speed; playbackRate = p.speed; speedVal.textContent = p.speed.toFixed(2) + 'x';
      audioEl.playbackRate = p.speed;
      reanalyzeCurrent();
    });
  });

  playPauseBtn.addEventListener('click', playPause);
  prevBtn.addEventListener('click', prevFragment);
  nextBtn.addEventListener('click', nextFragment);

  audioEl.addEventListener('ended', () => {
    if (!fragments.length || !analysisDone){
      if (currentIndex + 1 < playlist.length) switchToIndex(currentIndex + 1, true);
      else { isPlaying = false; updateStatusDisplay(); updateMediaSession(); }
    }
  });
  audioEl.addEventListener('play', () => { isPlaying = true; updateStatusDisplay(); updateMediaSession(); });
  audioEl.addEventListener('pause', () => { updateStatusDisplay(); });

  // ===== РЕГИСТРАЦИЯ SERVICE WORKER =====
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(err => {
      console.warn('SW registration failed:', err);
    });
  }

  // Начальные значения
  silenceThresholdVal.textContent = silenceThresholdInput.value + ' дБ';
  silenceDurationVal.textContent = parseFloat(silenceDurationInput.value).toFixed(1) + ' с';
  repeatsVal.textContent = repeatsInput.value;
  delayVal.textContent = parseFloat(interDelayInput.value).toFixed(1) + ' с';
  speedVal.textContent = parseFloat(playbackSpeedInput.value).toFixed(2) + 'x';
  updateStatusDisplay();
})();
</script>
</body>
</html>
